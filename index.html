<script>
  const img = document.getElementById("switching-img");
  const statusText = document.getElementById("status-text");

  const images = [
    "imgs/img16.jpg","imgs/img18.jpg","imgs/img5.jpg", "imgs/img3.jpg", "imgs/img1.jpg", "imgs/img2.jpg", "imgs/img19.jpg","imgs/img4.jpg","imgs/img17.jpg", "imgs/img14.jpg", "imgs/img6.jpg", "imgs/img8.jpg",
    "imgs/img9.jpg", "imgs/img10.jpg", "imgs/img11.jpg", "imgs/img15.jpg", "imgs/img12.jpg", "imgs/img13.jpg"
  ];

  let currentIndex = 0;
  let intervalId;
  let isPaused = false;

  function toggleImage() {
    currentIndex = (currentIndex + 1) % images.length;
    img.src = images[currentIndex];
  }

  function startSlideshow() {
  // 2000 is 2 secs per pic
  intervalId = setInterval(toggleImage, 2000);
  statusText.innerHTML = `
    <br>Click to pause 
    <img src="arrow.svg" alt="arrow" style="width:20px; height:auto; vertical-align:middle;  margin-bottom:8px; margin-left:5px;">
  `;
  statusText.style.position = "relative";
  statusText.style.left = "0px";
}

function stopSlideshow() {
  clearInterval(intervalId);
  statusText.innerHTML = "<br>Click to resume";
  statusText.style.position = "relative";
  
  statusText.style.left = "-8px";
}


  img.addEventListener("click", () => {
    if (isPaused) {
      startSlideshow();
    } else {
      stopSlideshow();
    }
    isPaused = !isPaused;
  });

  startSlideshow();
</script>

  <script>
    const MAX_DOTS = 0; 
    const DOT_LIFETIME = 4000; 
    const DOT_INTERVAL = 100; 
  
    function createDot() {
      const dot = document.createElement("div");
      dot.className = "dot";
  
      const size = Math.random() * 10 + 8;
      dot.style.width = size + "px";
      dot.style.height = size + "px";
  
      const pageHeight = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight
      );
      const pageWidth = Math.max(
        document.body.scrollWidth,
        document.documentElement.scrollWidth
      );
  
      dot.style.left = Math.random() * pageWidth + "px";
      dot.style.top = Math.random() * pageHeight + "px";
  
      document.body.appendChild(dot);
  
      setTimeout(() => dot.remove(), DOT_LIFETIME);
    }
  
    function maintainDots() {
      const currentDots = document.querySelectorAll(".dot").length;
      if (currentDots < MAX_DOTS) {
        createDot();
      }
    }
  
    setInterval(maintainDots, DOT_INTERVAL);
  </script>
